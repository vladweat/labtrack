name: Real browser/API acceptance

on:
  push:
    branches:
      - main
    paths:
      - "backend/**"
      - "web/**"
      - "scripts/**"
      - ".github/workflows/real-acceptance.yml"
      - "docs/development.md"
      - ".env.example"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: real-acceptance-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  real-acceptance:
    name: Sender → Courier → Lab real browser/API
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      LABTRACK_PYTHON_BIN: ${{ github.workspace }}/backend/.venv/bin/python
      LABTRACK_WEB_NODE_MODULES: ${{ github.workspace }}/web/node_modules
    defaults:
      run:
        working-directory: web
        shell: bash
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install backend development dependencies
        working-directory: backend
        timeout-minutes: 10
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install -e ".[dev]"

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install web dependencies
        timeout-minutes: 10
        run: npm ci

      - name: Install Playwright Chromium and operating-system dependencies
        timeout-minutes: 10
        run: npx playwright install --with-deps chromium

      - name: Cache the disposable PostgreSQL image
        timeout-minutes: 5
        run: docker pull postgres:15

      - name: Verify offline acceptance prerequisites
        timeout-minutes: 2
        run: |
          set -euo pipefail
          for required in docker python3 setsid; do
            if ! command -v "$required" >/dev/null 2>&1; then
              printf 'Missing acceptance runner command: %s.\n' "$required"
              exit 1
            fi
          done
          if [[ ! -x "$LABTRACK_PYTHON_BIN" ]]; then
            printf 'Configured backend interpreter is not executable.\n'
            exit 1
          fi
          if [[ ! -x "$LABTRACK_WEB_NODE_MODULES/.bin/playwright" ]]; then
            printf 'Installed Playwright CLI is unavailable.\n'
            exit 1
          fi
          image_id="$(docker image inspect --format '{{.Id}}' postgres:15 2>/dev/null || true)"
          if [[ ! "$image_id" =~ ^sha256:[[:xdigit:]]{64}$ ]]; then
            printf 'Cached postgres:15 image is unavailable.\n'
            exit 1
          fi
          printf 'Offline acceptance prerequisites verified.\n'

      - name: Run the real local acceptance scenario
        timeout-minutes: 15
        run: |
          set -euo pipefail
          test_log="$(mktemp "${RUNNER_TEMP:-/tmp}/real-acceptance.XXXXXX")"
          trap 'rm -f "$test_log"' EXIT
          if npm run test:acceptance:local >"$test_log" 2>&1; then
            printf 'Real Sender → Courier → Lab browser/API acceptance passed.\n'
          else
            status=$?
            stage="$(python3 - "$test_log" <<'PY'
          from pathlib import Path
          import re
          import sys

          allowed = {
              "preflight_commands",
              "preflight_playwright",
              "preflight_python",
              "preflight_postgres_image",
              "preflight_database_name",
              "preflight_loopback_ports",
              "workspace_setup",
              "postgres_startup",
              "migrations",
              "runtime_role_check",
              "fixture_setup",
              "provisioning",
              "api_startup",
              "browser_api",
              "unknown",
          }
          text = Path(sys.argv[1]).read_text(errors="replace")
          stages = re.findall(r"Local acceptance failure stage: ([a-z_]+) \(exit [0-9]+\)\.", text)
          print(stages[-1] if stages and stages[-1] in allowed else "unknown")
          PY
          )"
            checkpoint="$(python3 - "$test_log" <<'PY'
          from pathlib import Path
          import sys

          checkpoints = {
              "Local acceptance runner started.": "runner_started",
              "Stage I acceptance: fresh PostgreSQL, network none, no published container ports.": "postgres_startup",
              "Migrations: head applied; current/head/schema check passed.": "migrations_complete",
              "Runtime-role privileges and local organization scopes: passed.": "runtime_role_check_complete",
              "Local role CLI: created five fixtures, then reported five unchanged; output contains no credentials.": "provisioning_complete",
              "API: ready on 127.0.0.1; Vite will use its existing loopback proxy.": "api_ready",
          }
          text = Path(sys.argv[1]).read_text(errors="replace")
          last = "runner_not_started"
          for line in text.splitlines():
              last = checkpoints.get(line.strip(), last)
          print(last)
          PY
          )"
            if [[ "$stage" == unknown ]]; then
              case "$checkpoint" in
                runner_started) stage="preflight_commands" ;;
                postgres_startup) stage="postgres_startup" ;;
                migrations_complete) stage="runtime_role_check" ;;
                runtime_role_check_complete) stage="fixture_setup" ;;
                provisioning_complete) stage="api_startup" ;;
                api_ready) stage="browser_api" ;;
              esac
            fi
            failure_line="$(python3 - "$test_log" <<'PY'
          from pathlib import Path
          import re
          import sys

          text = Path(sys.argv[1]).read_text(errors="replace")
          matches = re.findall(r"e2e/local_real_acceptance\.spec\.ts:(\d+):\d+", text)
          print(matches[-1] if matches else "unavailable")
          PY
          )"
            printf '::error title=Real acceptance failed::The isolated runner failed during %s (exit %s; last safe checkpoint: %s; test source line: %s). Raw diagnostics were withheld and not uploaded.\n' "$stage" "$status" "$checkpoint" "$failure_line"
            {
              printf '### Real browser/API acceptance failed\n\n'
              printf 'Failure stage: `%s`; last safe checkpoint: `%s`; test source line: `%s`; exit status: `%s`. Raw output was withheld and no runner logs or artifacts were uploaded.\n\n' "$stage" "$checkpoint" "$failure_line" "$status"
              printf 'Reproduce locally with `cd web && npm run test:acceptance:local` after installing the documented dependencies.\n'
            } >> "$GITHUB_STEP_SUMMARY"
            exit "$status"
          fi
